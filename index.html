<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文价猩-标书智能报价平台</title>
    <script>
      (function () {
        try {
          var isDark = false;
          var raw = localStorage.getItem('bidQuotationConfig');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme === 'dark') {
              isDark = true;
            }
          }
          var html = document.documentElement;
          if (isDark) {
            html.classList.add('dark');
            html.style.backgroundColor = '#222222';
            html.style.color = '#F2EDE4';
          } else {
            html.style.backgroundColor = '#FDF5E6';
            html.style.color = '#3D2B1F';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      input, select, textarea, button {
        border: 1px solid var(--color-border, #E8DCC8);
        background: var(--color-card, #FBF7EF);
        color: var(--color-text, #3D2B1F);
      }
      .dark input, .dark select, .dark textarea, .dark button {
        border-color: var(--color-dark-border, #3D3D3D);
        background: var(--color-dark-card, #2D2D2D);
        color: var(--color-dark-text, #F2EDE4);
      }
    </style>
    <link rel="stylesheet" href="/remixicon.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
